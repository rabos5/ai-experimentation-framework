<!DOCTYPE html>
<html lang="en" data-theme="fox">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Playground</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5.0.0/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="/css/fox_theme.css" rel="stylesheet" type="text/css" />
    <style>
        .model-container {
            transition: width 0.3s ease;
        }

        .config-section {
            transition: max-height 0.3s ease-in-out, opacity 0.2s ease-in-out;
            overflow: hidden;
        }

        .config-section.collapsed {
            max-height: 0;
            opacity: 0;
        }

        .prompt-area {
            max-height: 50vh;
            min-height: 100px;
            resize: vertical;
        }
    </style>
</head>
<body class="min-h-screen bg-base-100 text-base-content">
    <!-- Sidebar -->
    <div id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-base-200 border-r border-base-300 p-4 transform -translate-x-full transition-transform duration-200 ease-in-out z-50">
        <h2 class="text-xl font-semibold mb-4">Conversations</h2>
        <div class="space-y-2">
            <button class="btn btn-ghost w-full justify-start">conv_123456</button>
            <button class="btn btn-ghost w-full justify-start">conv_789012</button>
            <button class="btn btn-ghost w-full justify-start">conv_345678</button>
        </div>
    </div>

    <!-- Toggle Sidebar Button -->
    <button id="toggleSidebar" class="btn btn-ghost fixed left-4 top-4 z-40">
        ☰
    </button>

    <!-- Main Content -->
    <main class="ml-16 p-8">
        <!-- Add Model Button -->
        <div class="flex justify-end mb-4">
            <button id="addModelBtn" class="btn btn-primary">
                <span class="enabled-text">+</span>
                <span class="disabled-text hidden">+</span>
            </button>
        </div>

        <!-- Model Containers Wrapper -->
        <div id="modelContainersWrapper" class="flex gap-4 mb-6">
            <!-- Single Model Container Template -->
            <div class="model-container w-full card bg-base-200 border border-base-300">
                <!-- Config Toggle Header -->
                <div class="card-body">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="card-title">Model Configuration</h2>
                        <div class="flex items-center gap-2">
                            <button class="config-toggle btn btn-ghost btn-sm">
                                ▼
                            </button>
                            <button class="remove-container-btn btn btn-ghost btn-sm">
                                ✕
                            </button>
                        </div>
                    </div>

                    <!-- Collapsible Config Section -->
                    <div class="config-section">
                        <div class="space-y-4 mb-4">
                            <!-- Provider Select -->
                            <div class="form-control">
                                <label class="label">
                                    <span class="label-text">Provider</span>
                                </label>
                                <select class="provider-select select select-bordered w-full">
                                    <option value="openai">OpenAI</option>
                                    <option value="anthropic">Anthropic</option>
                                    <option value="google">Google</option>
                                    <option value="mistral">Mistral</option>
                                </select>
                            </div>

                            <!-- Model Select -->
                            <div class="form-control">
                                <label class="label">
                                    <span class="label-text">Model</span>
                                </label>
                                <select class="model-select select select-bordered w-full">
                                    <option value="gpt4">GPT-4</option>
                                    <option value="gpt35">GPT-3.5</option>
                                </select>
                            </div>

                            <!-- Saved Prompts -->
                            <div class="form-control">
                                <label class="label">
                                    <span class="label-text">Saved Prompts</span>
                                </label>
                                <select class="prompt-select select select-bordered w-full">
                                    <option value="">Select a prompt...</option>
                                    <option value="story">Write a story about...</option>
                                    <option value="code">Analyze this code...</option>
                                    <option value="concept">Explain the concept of...</option>
                                </select>
                            </div>

                            <!-- Sliders -->
                            <div class="space-y-4">
                                <div class="form-control">
                                    <label class="label">
                                        <span class="label-text">Temperature: <span class="temp-value">0.56</span></span>
                                    </label>
                                    <input type="range" class="temperature range range-primary" min="0" max="1" step="0.01" value="0.56">
                                </div>

                                <div class="form-control">
                                    <label class="label">
                                        <span class="label-text">Maximum Length: <span class="max-length-value">256</span></span>
                                    </label>
                                    <input type="range" class="max-length range range-primary" min="1" max="2048" step="1" value="256">
                                </div>

                                <div class="form-control">
                                    <label class="label">
                                        <span class="label-text">Top P: <span class="top-p-value">0.9</span></span>
                                    </label>
                                    <input type="range" class="top-p range range-primary" min="0" max="1" step="0.01" value="0.9">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Chat Area -->
                    <div class="chat-area hidden mt-4 space-y-4">
                        <!-- Messages will be dynamically added here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Shared Prompt Area -->
        <div class="w-full space-y-4">
            <textarea
                id="sharedPromptArea"
                class="prompt-area textarea textarea-bordered w-full"
                placeholder="Write a prompt..."></textarea>

            <!-- File Upload and Buttons Container -->
            <div class="flex justify-between items-center">
                <!-- File Upload -->
                <div class="flex-grow">
                    <input type="file"
                           id="fileUpload"
                           multiple
                           class="file-input file-input-bordered w-full max-w-xs">
                </div>

                <!-- Buttons -->
                <div class="flex gap-2">
                    <button id="resetBtn" class="btn btn-secondary">
                        Reset
                    </button>
                    <button id="submitBtn" class="btn btn-primary">
                        Submit
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Model data
        const modelsByProvider = {
            openai: ['GPT-4', 'GPT-3.5'],
            anthropic: ['Claude 3 Opus', 'Claude 3 Sonnet'],
            google: ['Gemini Pro', 'Gemini Ultra'],
            mistral: ['Mistral Large', 'Mistral Medium']
        };

        // Sidebar functionality
        const sidebar = document.getElementById('sidebar');
        const toggleSidebar = document.getElementById('toggleSidebar');
        toggleSidebar.addEventListener('click', () => {
            sidebar.classList.toggle('-translate-x-full');
        });

        const MAX_CONTAINERS = 3;
        const wrapper = document.getElementById('modelContainersWrapper');
        const addModelBtn = document.getElementById('addModelBtn');
        const templateContainer = wrapper.children[0];
        const sharedPromptArea = document.getElementById('sharedPromptArea');
        const submitBtn = document.getElementById('submitBtn');
        const resetBtn = document.getElementById('resetBtn');

        // Initialize first container
        initializeContainer(templateContainer);
        updateRemoveButtons();
        
        function initializeContainer(container) {
            // Config toggle
            const toggleBtn = container.querySelector('.config-toggle');
            const configSection = container.querySelector('.config-section');
            toggleBtn.addEventListener('click', () => {
                configSection.classList.toggle('collapsed');
                toggleBtn.textContent = 
                    configSection.classList.contains('collapsed') ? '▼' : '▲';
            });

            // Provider change handler
            const providerSelect = container.querySelector('.provider-select');
            const modelSelect = container.querySelector('.model-select');
            providerSelect.addEventListener('change', () => {
                const provider = providerSelect.value;
                modelSelect.innerHTML = modelsByProvider[provider]
                    .map(model => `<option value="${model.toLowerCase()}">${model}</option>`)
                    .join('');
            });

            // Slider handlers
            container.querySelectorAll('input[type="range"]').forEach(slider => {
                const valueDisplay = slider.previousElementSibling.querySelector('span');
                slider.addEventListener('input', () => {
                    valueDisplay.textContent = slider.value;
                });
            });

            // Remove container handler
            const removeBtn = container.querySelector('.remove-container-btn');
            removeBtn.addEventListener('click', () => {
                if (wrapper.children.length > 1) {
                    container.remove();
                    updateContainerWidths();
                    updateRemoveButtons();
                    addModelBtn.disabled = wrapper.children.length >= MAX_CONTAINERS;
                    updateAddButtonStyle();
                }
            });
        }

        function updateContainerWidths() {
            const containerCount = wrapper.children.length;
            const width = `${100 / containerCount}%`;
            Array.from(wrapper.children).forEach(container => {
                container.style.width = width;
            });
        }

        function updateRemoveButtons() {
            const containers = wrapper.children;
            Array.from(containers).forEach(container => {
                const removeBtn = container.querySelector('.remove-container-btn');
                removeBtn.style.visibility = containers.length === 1 ? 'hidden' : 'visible';
            });
        }

        function updateAddButtonStyle() {
            const isDisabled = wrapper.children.length >= MAX_CONTAINERS;
            addModelBtn.disabled = isDisabled;
            addModelBtn.querySelector('.enabled-text').classList.toggle('hidden', isDisabled);
            addModelBtn.querySelector('.disabled-text').classList.toggle('hidden', !isDisabled);
        }

        addModelBtn.addEventListener('click', () => {
            if (wrapper.children.length < MAX_CONTAINERS) {
                const newContainer = templateContainer.cloneNode(true);
                wrapper.appendChild(newContainer);
                initializeContainer(newContainer);
                updateContainerWidths();
                updateRemoveButtons();
                updateAddButtonStyle();
            }
        });

        // Shared prompt handlers
        submitBtn.addEventListener('click', () => {
            const prompt = sharedPromptArea.value;
            if (!prompt.trim()) return;

            Array.from(wrapper.children).forEach(container => {
                const chatArea = container.querySelector('.chat-area');
                chatArea.classList.remove('hidden');
                
                // Add user message
                const userMessageDiv = document.createElement('div');
                userMessageDiv.className = 'chat chat-end';
                userMessageDiv.innerHTML = `
                    <div class="chat-header">User</div>
                    <div class="chat-bubble chat-bubble-primary">${prompt}</div>
                `;
                chatArea.appendChild(userMessageDiv);

                // Add model message
                const modelMessageDiv = document.createElement('div');
                modelMessageDiv.className = 'chat chat-start';
                const modelName = container.querySelector('.model-select').value;
                modelMessageDiv.innerHTML = `
                    <div class="chat-header">${modelName}</div>
                    <div class="chat-bubble chat-bubble-secondary">Sample response from the model would appear here...</div>
                `;
                chatArea.appendChild(modelMessageDiv);

                // Scroll to bottom
                chatArea.scrollTop = chatArea.scrollHeight;
            });
        });

        resetBtn.addEventListener('click', () => {
            sharedPromptArea.value = '';
            document.getElementById('fileUpload').value = '';
            Array.from(wrapper.children).forEach(container => {
                container.querySelector('.provider-select').value = 'openai';
                container.querySelector('.provider-select').dispatchEvent(new Event('change'));
                container.querySelector('.prompt-select').value = '';
                container.querySelectorAll('input[type="range"]').forEach(slider => {
                    slider.value = slider.defaultValue;
                    slider.dispatchEvent(new Event('input'));
                });
                const chatArea = container.querySelector('.chat-area');
                chatArea.innerHTML = '';
                chatArea.classList.add('hidden');
            });
        });

        // Initialize the add button style
        updateAddButtonStyle();
    </script>
</body>
</html>
